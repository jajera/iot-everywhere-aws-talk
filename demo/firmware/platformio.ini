; Talk demo board: ESP32-C61-DevKitC-1
; Hardware baseline (ACM vs CH340, huge_app erase, LED SPI+DMA): README.md
; Full lab remains S3-oriented: https://aws-iot-walkthrough.johna.kiwi/

[platformio]
default_envs = esp32-c61

; C61 has no RMT — Arduino + ESP-IDF so the sketch can depend on
; espressif/led_strip (SPI + DMA) via src/idf_component.yml. Owns SPI2 for the LED.
[env:esp32-c61]
platform = espressif32
board = esp32-c61-devkitc1
framework = arduino, espidf
monitor_speed = 115200
; Hybrid IDF+Arduino image is >1MB — default factory slot is too small.
; First flash / after changing this table: pio run -e esp32-c61 -t erase
board_build.partitions = partitions/huge_app.csv
build_flags =
  -I include
  ; USB Serial/JTAG on DevKitC-1 — without CDC, Serial goes to UART pins, not /dev/ttyACM*
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  256dpi/MQTT @ ^2.5.3
  bblanchon/ArduinoJson @ ^7.0.0

; Optional: keep an S3 desk board on the same payload contract (has RMT → rgbLedWrite)
[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
  -I include
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  256dpi/MQTT @ ^2.5.3
  bblanchon/ArduinoJson @ ^7.0.0
